<!DOCTYPE html>
<html>
<head>

    Alternatively, build your application passing the --base-href parameter
    specifying the new root path of your web app.

  <meta property="og:title" content="AtmoSense - Sistem Monitoring dan Prediksi Kualitas Udara Berbasis IoT dan Machine Learning" />
  <meta property="og:description" content="AtmoSense merupakan aplikasi monitoring kualitas udara berbasis Internet of Things (IoT) dan Machine Learning yang menampilkan data sensor secara realtime, histori pemantauan, serta prediksi kualitas udara untuk mendukung kesadaran lingkungan dan kesehatan masyarakat." />
  <meta property="og:image" content="https://storage.googleapis.com/flutterflow-prod-hosting/og_splash_gradient.png" /> 
  <meta name="twitter:title" content="AtmoSense - Sistem Monitoring dan Prediksi Kualitas Udara Berbasis IoT dan Machine Learning" />

  <meta name="twitter:image" content="https://storage.googleapis.com/flutterflow-prod-hosting/og_splash_gradient.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <title> AtmoSense - Sistem Monitoring dan Prediksi Kualitas Udara Berbasis IoT dan Machine Learning </title>
  <meta name="description" content="AtmoSense merupakan aplikasi monitoring kualitas udara berbasis Internet of Things (IoT) dan Machine Learning yang menampilkan data sensor secara realtime, histori pemantauan, serta prediksi kualitas udara untuk mendukung kesadaran lingkungan dan kesehatan masyarakat." />
    

  <!-- Status Bar color in Safari browser (iOS) and PWA -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f1f4f8">
  <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#f1f4f8">

  <link rel="manifest" href="manifest.json">
